{% extends 'base.html' %}

{% block title %}{{ article.title }} | {% endblock %}

{% block content %}
  <article class="post">
    <header>
      <div>
        <h2>{{ article.title }}</h2>
        <div class="post-meta">
          <strong>{{ article.author or AUTHOR }}</strong>
          &nbsp;on&nbsp;
          {{ article.date.strftime('%Y-%m-%d') }}
          &nbsp;&nbsp;·&nbsp;&nbsp;
          <a href="{{ SITEURL }}/{{ article.category.url }}">{{ article.category.name }}</a>
        </div>
      </div>
    </header>
    <div class="body">
      {{ article.content }}
    </div>
  </article>
{% endblock %}
